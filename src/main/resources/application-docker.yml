# Configurações específicas para o profile 'docker' do api-gateway.
spring:
  config:
    activate:
      on-profile: docker

# Endereços dos serviços apontando para os nomes dos containers (DNS do Docker Compose).
services:
  user:
    uri: http://user-service:8080
  parcel:
    uri: http://parcel-service:8080

# Porta do gateway interna (não muda, o compose mapeia 8080 -> 8085 no host)
server:
  port: 8080

# Secret JWT vindo da variável de ambiente SECURITY_JWT_SECRET (fallback para dev)
security:
  jwt:
    secret: ${SECURITY_JWT_SECRET:test-secret}